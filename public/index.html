<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d4ed8">
<title>Ward Issue Entry</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img src="janasena-Logo.png" alt="Jana Sena" class="logo" onerror="this.style.display='none'">
  <h1>Pithapuram Municipality – Ward Survey</h1>
  <small>Door-to-door issue entry</small>
  <div style="display:flex;justify-content:center;align-items:center;gap:10px;margin-top:8px">
    <label for="avatarIn" title="Change photo" style="margin:0;cursor:pointer;position:relative"><img id="avatar" alt="" style="width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--pri);background:var(--soft)"><span style="position:absolute;right:-4px;bottom:-4px;background:var(--pri);color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:18px;text-align:center">📷</span></label>
    <input type="file" id="avatarIn" accept="image/*" style="display:none">
    <span><b id="who"></b><br><a href="#" id="logout" style="font-size:13px">Logout</a></span>
  </div>
</header>
<main>
<form id="f" class="card" autocomplete="off">
  <div class="row">
    <div><label>City</label><input type="text" value="Pithapuram" disabled></div>
    <div><label for="ward">Ward</label><select id="ward"></select></div>
  </div>
  <label for="coord">Sevak</label><input type="text" id="coord" disabled>

  <h3>Citizen details</h3>
  <label for="name">Name *</label><input type="text" id="name" required>
  <label for="phone">Phone No *</label><input type="tel" id="phone" inputmode="numeric" maxlength="10" placeholder="10-digit mobile" required>
  <label for="addr">Address</label><textarea id="addr" rows="2"></textarea>

  <h3>Issues (select all that apply)</h3>
  <div class="checks" id="checks"></div>
  <div id="otherBox" style="display:none"><label for="other">Others – describe</label><textarea id="other" rows="2"></textarea></div>

  <h3>Issue proof (photos, max 5)</h3>
  <input type="file" id="photo" accept="image/*" capture="environment" style="display:none">
  <button type="button" class="btn sec" id="pickPhoto">📷 Take / choose photo</button>
  <div id="prev" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px"></div>

  <button class="btn big" id="go" type="submit">Submit</button>
  <div id="msg"></div>
</form>
</main>
<script>
const CATS=[["Pension","Pension"],["Old Age","Old Age"],["Handicapped","Handicapped"],["Dialysis","Dialysis"],["Widow","Widow"],["Single Women","Single Women"],["Drainage","Drainage"],["Sanitation","Sanitation"],["Street Lights","Street Lights"],["Roads","Roads"],["Tax","Tax"],["Govt Subsidies & Schemes","Govt Subsidies & Schemes"],["Others","Others"]];
const $=id=>document.getElementById(id);
$("ward").innerHTML=Array.from({length:31},(_,i)=>`<option ${i==28?"selected":""}>${i+1}</option>`).join("");
$("checks").innerHTML=CATS.map(([v,l])=>`<label><input type="checkbox" value="${v}">${l}</label>`).join("");
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||"";localStorage.setItem(k,v)}catch{return ""}};
let tk="";try{tk=localStorage.getItem("ctk")||""}catch{}
if(!tk)location.replace("login.html");
$("coord").value=ls("cname");$("who").textContent=ls("cname");
const toAvatar=f=>new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(f);img.onload=()=>{const n=256,k=Math.max(n/img.width,n/img.height),w=img.width*k,h=img.height*k,c=document.createElement("canvas");c.width=c.height=n;c.getContext("2d").drawImage(img,(n-w)/2,(n-h)/2,w,h);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.8))};img.onerror=()=>rej(new Error("Could not read that image"));img.src=u});
const DEF="data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44"><rect width="44" height="44" fill="#fde2e2"/><circle cx="22" cy="17" r="8" fill="#e11d1d"/><path d="M6 44c0-11 7-16 16-16s16 5 16 16z" fill="#e11d1d"/></svg>');
$("avatar").src=ls("cphoto")||DEF;
fetch("/api/me",{headers:{authorization:"Bearer "+tk}}).then(r=>r.ok?r.json():null).then(d=>{if(!d)return;$("who").textContent=d.name;$("coord").value=d.name;ls("cname",d.name);ls("cphoto",d.photo);$("avatar").src=d.photo||DEF}).catch(()=>{});
$("avatarIn").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const p=await toAvatar(f);const r=await fetch("/api/profile/photo",{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+tk},body:JSON.stringify({photo:p})});
    if(!r.ok)throw new Error((await r.json()).error);ls("cphoto",p);$("avatar").src=p}catch(err){alert(err.message)}});
$("logout").onclick=e=>{e.preventDefault();try{["ctk","cname","cphoto"].forEach(k=>localStorage.removeItem(k))}catch{}location.href="login.html"};
$("ward").value=ls("ward")||"29";
$("checks").addEventListener("change",()=>{$("otherBox").style.display=[...document.querySelectorAll("#checks input")].some(c=>c.value=="Others"&&c.checked)?"block":"none"});
let photos=[];
function drawPhotos(){
  $("prev").innerHTML=photos.map((d,k)=>`<div style="position:relative"><img src="${d}" style="height:90px;width:90px;object-fit:cover;border-radius:10px;border:1.5px solid var(--line)"><button type="button" data-rm="${k}" style="position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:#b91c1c;color:#fff;cursor:pointer">×</button></div>`).join("");
  $("pickPhoto").textContent=photos.length?"📷 Add another photo ("+photos.length+"/5)":"📷 Take / choose photo";
  $("pickPhoto").disabled=photos.length>=5;
  $("prev").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{photos.splice(+b.dataset.rm,1);drawPhotos()});
}
$("pickPhoto").onclick=()=>$("photo").click();
$("photo").addEventListener("change",e=>{
  const f=e.target.files[0];e.target.value="";if(!f||photos.length>=5)return;
  const img=new Image(),u=URL.createObjectURL(f);
  img.onload=()=>{const m=1280,k=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(u);photos.push(c.toDataURL("image/jpeg",.72));drawPhotos()};
  img.onerror=()=>show("Could not read that image",false);img.src=u;
});
function show(t,ok){$("msg").innerHTML=`<div class="msg ${ok?"ok":"err"}">${t}</div>`}
$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const issues=[...document.querySelectorAll("#checks input:checked")].map(c=>c.value);
  $("go").disabled=true;
  try{
    const r=await fetch("/api/submit",{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+tk},
      body:JSON.stringify({ward:$("ward").value,name:$("name").value,phone:$("phone").value,address:$("addr").value,issues,other:$("other").value,photos})});
    const d=await r.json();
    if(r.status===401){try{localStorage.removeItem("ctk")}catch{}alert(d.error||"Please login again");location.href="login.html";return}
    if(!r.ok)throw new Error(d.error||"Failed");
    ls("ward",$("ward").value);
    const wa="https://wa.me/91"+$("phone").value.replace(/\D/g,"")+"?text="+encodeURIComponent(`Pithapuram Municipality (Ward ${$("ward").value}): Your complaint ${d.id} (${issues.join(", ")}) is registered. Status: OPEN.`);
    show(`Submitted ✔ Ticket <b>${d.id}</b>${d.sms?" · SMS sent":""}. <a href="${wa}" target="_blank" rel="noopener"><b>Send ticket on WhatsApp</b></a>`,true);
    ["name","phone","addr","other"].forEach(i=>$(i).value="");
    photos=[];drawPhotos();document.querySelectorAll("#checks input").forEach(c=>c.checked=false);$("otherBox").style.display="none";
    window.scrollTo({top:0,behavior:"smooth"});
  }catch(err){show(err.message,false)}
  $("go").disabled=false;
});
</script>
</body>
</html>
